apiVersion: apps/v1
kind: Deployment
metadata:
  name: limit-service
  namespace: money-transfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: limit-service
  template:
    metadata:
      labels:
        app: limit-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgresql 5432; do echo waiting for postgresql; sleep 2; done"]
      containers:
        - name: limit-service
          image: limit-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: limit-service
  namespace: money-transfer
spec:
  selector:
    app: limit-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
