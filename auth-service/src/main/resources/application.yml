server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: postgres
    password: 123456
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: bXktc3VwZXItc2VjcmV0LWtleS1mb3ItbW9uZXktdHJhbnNmZXItcGxhdGZvcm0tMjAyNA==
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000
