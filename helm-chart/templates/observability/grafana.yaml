{{- if .Values.observability.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Elasticsearch
        type: elasticsearch
        uid: elasticsearch
        url: http://elasticsearch:9200
        editable: true
        jsonData:
          index: "money-transfer-*"
          timeField: "@timestamp"
          logMessageField: "message"
          logLevelField: "log.level"
          esVersion: "8.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.observability.grafana.adminPassword | quote }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: {{ .Values.observability.grafana.resources.requests.cpu }}
              memory: {{ .Values.observability.grafana.resources.requests.memory }}
            limits:
              cpu: {{ .Values.observability.grafana.resources.limits.cpu }}
              memory: {{ .Values.observability.grafana.resources.limits.memory }}
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: {{ .Values.observability.grafana.nodePort }}
  selector:
    app: grafana
{{- end }}
