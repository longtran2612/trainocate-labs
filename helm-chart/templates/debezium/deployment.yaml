apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka-connect
    {{- include "money-transfer.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."
                sleep 3
              done
              echo "Kafka is ready!"
      containers:
        - name: kafka-connect
          image: {{ .Values.debezium.image }}
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: GROUP_ID
              value: "1"
            - name: CONFIG_STORAGE_TOPIC
              value: connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: connect-statuses
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.debezium.resources.requests.cpu }}
              memory: {{ .Values.debezium.resources.requests.memory }}
            limits:
              cpu: {{ .Values.debezium.resources.limits.cpu }}
              memory: {{ .Values.debezium.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka-connect
    {{- include "money-transfer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: kafka-connect
