server:
  port: 8083

spring:
  application:
    name: kyc-service
  datasource:
    url: jdbc:postgresql://localhost:5432/kyc_db
    username: postgres
    password: 123456
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
