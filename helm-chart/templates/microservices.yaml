{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
    {{- include "money-transfer.labels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas | default $.Values.javaDefaults.replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ .port | quote }}
    spec:
      {{- if or .hasDb .hasKafka .hasRedis }}
      initContainers:
        {{- if .hasDb }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        {{- end }}
        {{- if .hasKafka }}
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."
                sleep 2
              done
              echo "Kafka is ready!"
        {{- end }}
        {{- if .hasRedis }}
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ .name }}:latest
          imagePullPolicy: {{ $.Values.javaDefaults.imagePullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .springProfiles | default $.Values.javaDefaults.springProfile }}
            - name: JAVA_OPTS
              value: {{ .javaOpts | default $.Values.javaDefaults.javaOpts | quote }}
            {{- if .keycloakServerUrl }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ .keycloakServerUrl }}
            {{- end }}
            {{- if .springProfiles }}
            {{- if contains "keycloak" .springProfiles }}
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak:8080/realms/money-transfer
            {{- end }}
            {{- end }}
            {{- if $.Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .name }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_always_on
            {{- end }}
            {{- if .hasDb }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: {{ $.Values.javaDefaults.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.javaDefaults.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.javaDefaults.readinessProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: {{ $.Values.javaDefaults.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.javaDefaults.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.javaDefaults.livenessProbe.timeoutSeconds }}
          resources:
            requests:
              cpu: {{ $.Values.javaDefaults.resources.requests.cpu }}
              memory: {{ $.Values.javaDefaults.resources.requests.memory }}
            limits:
              cpu: {{ $.Values.javaDefaults.resources.limits.cpu }}
              memory: {{ $.Values.javaDefaults.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
    {{- include "money-transfer.labels" $ | nindent 4 }}
spec:
  type: {{ if .nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
  selector:
    app: {{ .name }}
{{- end }}
