# -- Namespace
namespace: money-transfer

# -- PostgreSQL
postgresql:
  image: postgres:16-alpine
  storage: 1Gi
  credentials:
    username: postgres
    password: "123456"
  databases:
    - auth
    - account_db
    - kyc_db
    - limit_db
    - transaction_db
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Kong Gateway (DB-less)
kong:
  image: kong:3.9
  nodePort:
    proxy: 30000
    admin: 30001
  rateLimiting:
    auth:
      minute: 30
    transaction:
      minute: 60
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  routes:
    - service: auth-service
      port: 8081
      path: /api/v1/auth
    - service: account-service
      port: 8082
      path: /api/v1/accounts
    - service: kyc-service
      port: 8083
      path: /api/v1/kyc
    - service: limit-service
      port: 8084
      path: /api/v1/limits
    - service: transaction-service
      port: 8085
      path: /api/v1/transactions

# -- Redis (CQRS read model cache)
redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Kafka (KRaft mode, CDC event streaming)
kafka:
  image: bitnami/kafka:3.9
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- Debezium Kafka Connect (CDC)
debezium:
  image: debezium/connect:2.7
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- Frontend (React + nginx)
frontend:
  enabled: true
  image: money-transfer-web:latest
  replicas: 1
  nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Java service defaults
javaDefaults:
  imagePullPolicy: IfNotPresent
  replicas: 1
  springProfile: k8s
  javaOpts: "-Xms128m -Xmx384m"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 640Mi
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 3

# -- Microservices
services:
  - name: auth-service
    port: 8081
    hasDb: true
    dbName: auth

  - name: account-service
    port: 8082
    hasDb: true
    dbName: account_db
    extraEnv:
      - name: SPRING_DATA_REDIS_HOST
        value: redis
      - name: SPRING_DATA_REDIS_PORT
        value: "6379"
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092

  - name: kyc-service
    port: 8083
    hasDb: true
    dbName: kyc_db

  - name: limit-service
    port: 8084
    hasDb: true
    dbName: limit_db

  - name: transaction-service
    port: 8085
    hasDb: true
    dbName: transaction_db

  - name: internal-transfer-service
    port: 8086
    hasDb: false

  - name: external-transfer-service
    port: 8087
    hasDb: false

  - name: napas-simulator
    port: 8088
    hasDb: false
