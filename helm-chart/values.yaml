# -- Namespace
namespace: money-transfer

# -- Keycloak
keycloak:
  enabled: true
  nodePort: 30900
  adminUsername: admin
  adminPassword: admin
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- PostgreSQL
postgresql:
  image: postgres:16-alpine
  storage: 1Gi
  credentials:
    username: postgres
    password: "123456"
  databases:
    - auth
    - account_db
    - kyc_db
    - limit_db
    - transaction_db
    - onboarding_db
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Kafka (KRaft mode, CDC event streaming)
kafka:
  image: apache/kafka:3.8.0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- Redis (CQRS read model cache)
redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Debezium Kafka Connect (CDC)
debezium:
  image: quay.io/debezium/connect:2.7
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- Kong Gateway (DB-less)
kong:
  image: kong:3.9
  nodePort:
    proxy: 30000
    admin: 30001
  rateLimiting:
    auth:
      minute: 30
    transaction:
      minute: 60
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  routes:
    - service: auth-service
      port: 8081
      path: /api/v1/auth
    - service: account-service
      port: 8082
      path: /api/v1/accounts
    - service: kyc-service
      port: 8083
      path: /api/v1/kyc
    - service: limit-service
      port: 8084
      path: /api/v1/limits
    - service: transaction-service
      port: 8085
      path: /api/v1/transactions
    - service: onboarding-service
      port: 8090
      path: /api/v1/onboarding

# -- Frontend (React + nginx)
frontend:
  enabled: true
  image: money-transfer-web:latest
  replicas: 1
  nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Java service defaults
javaDefaults:
  imagePullPolicy: IfNotPresent
  replicas: 1
  springProfile: k8s
  javaOpts: "-Xms128m -Xmx384m"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 640Mi
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 3

# -- Microservices
services:
  - name: auth-service
    port: 8081
    hasDb: true
    dbName: auth
    keycloakServerUrl: "http://keycloak:8080"

  - name: account-service
    port: 8082
    hasDb: true
    dbName: account_db
    hasKafka: true
    hasRedis: true
    springProfiles: "k8s,keycloak"
    extraEnv:
      - name: SPRING_DATA_REDIS_HOST
        value: redis
      - name: SPRING_DATA_REDIS_PORT
        value: "6379"
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - name: ACCOUNT_READ_MODEL_MAX_STALENESS_MS
        value: "30000"

  - name: kyc-service
    port: 8083
    hasDb: true
    dbName: kyc_db
    hasKafka: true
    springProfiles: "k8s,keycloak"

  - name: limit-service
    port: 8084
    hasDb: true
    dbName: limit_db
    hasKafka: true
    springProfiles: "k8s,keycloak"

  - name: transaction-service
    port: 8085
    hasDb: true
    dbName: transaction_db
    hasKafka: true
    springProfiles: "k8s,keycloak"

  - name: onboarding-service
    port: 8090
    hasDb: true
    dbName: onboarding_db
    replicas: 1   # do NOT scale Camunda 7 beyond 1 without cluster-aware job executor
    javaOpts: "-Xms128m -Xmx512m --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED"

  - name: internal-transfer-service
    port: 8086
    hasDb: false
    springProfiles: "k8s,keycloak"

  - name: external-transfer-service
    port: 8087
    hasDb: false
    springProfiles: "k8s,keycloak"

  - name: napas-simulator
    port: 8088
    hasDb: false

# -- Observability (Prometheus + Grafana + Jaeger + ELK)
observability:
  enabled: true
  prometheus:
    nodePort: 30090
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
  grafana:
    nodePort: 30030
    adminPassword: admin
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  jaeger:
    nodePort: 30686
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
  elasticsearch:
    javaOpts: "-Xms512m -Xmx512m"
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 1Gi
  kibana:
    nodePort: 30601
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
