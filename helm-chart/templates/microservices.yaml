{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
    {{- include "money-transfer.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.javaDefaults.replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if .hasDb }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ .name }}:latest
          imagePullPolicy: {{ $.Values.javaDefaults.imagePullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $.Values.javaDefaults.springProfile }}
            - name: JAVA_OPTS
              value: {{ $.Values.javaDefaults.javaOpts | quote }}
            {{- if .hasDb }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- range .extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: {{ $.Values.javaDefaults.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.javaDefaults.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.javaDefaults.readinessProbe.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: {{ $.Values.javaDefaults.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.javaDefaults.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.javaDefaults.livenessProbe.timeoutSeconds }}
          resources:
            requests:
              cpu: {{ $.Values.javaDefaults.resources.requests.cpu }}
              memory: {{ $.Values.javaDefaults.resources.requests.memory }}
            limits:
              cpu: {{ $.Values.javaDefaults.resources.limits.cpu }}
              memory: {{ $.Values.javaDefaults.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
    {{- include "money-transfer.labels" $ | nindent 4 }}
spec:
  type: {{ if .nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
  selector:
    app: {{ .name }}
{{- end }}
