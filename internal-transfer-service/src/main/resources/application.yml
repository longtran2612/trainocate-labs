server:
  port: 8086

spring:
  application:
    name: internal-transfer-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


# ── Observability ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  structured:
    format:
      console: ecs

