apiVersion: v1
kind: Service
metadata:
  name: kong-gateway
  namespace: money-transfer
spec:
  selector:
    app: kong-gateway
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30000
    - name: admin
      port: 8001
      targetPort: 8001
      nodePort: 30001
  type: NodePort
