input {
  beats {
    port => 5044
  }
}

filter {
  # Parse ECS JSON emitted by Spring Boot structured logging
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "ecs"
      skip_on_invalid_json => true
    }
    if [ecs] {
      mutate {
        # Promote key ECS fields to top level for easier Kibana searching
        add_field => {
          "log_level"    => "%{[ecs][log.level]}"
          "service_name" => "%{[ecs][service.name]}"
          "trace_id"     => "%{[ecs][trace.id]}"
          "span_id"      => "%{[ecs][span.id]}"
          "log_message"  => "%{[ecs][message]}"
        }
        remove_field => ["message"]
      }
    }
  }

  # Tag by container name for easy filtering
  if [container][name] {
    mutate {
      add_field => { "container_name" => "%{[container][name]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "money-transfer-%{+YYYY.MM.dd}"
  }
}
