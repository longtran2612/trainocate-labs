services:

  # ===================== INFRASTRUCTURE =====================

  postgres:
    image: postgres:16-alpine
    container_name: mt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - money-transfer-net

  eureka-server:
    build:
      context: .
      args:
        SERVICE_NAME: eureka-server
        SERVICE_PORT: 8761
    container_name: mt-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - money-transfer-net

  # ===================== CORE SERVICES =====================

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
        SERVICE_PORT: 8081
    container_name: mt-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  account-service:
    build:
      context: .
      args:
        SERVICE_NAME: account-service
        SERVICE_PORT: 8082
    container_name: mt-account
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  kyc-service:
    build:
      context: .
      args:
        SERVICE_NAME: kyc-service
        SERVICE_PORT: 8083
    container_name: mt-kyc
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kyc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  limit-service:
    build:
      context: .
      args:
        SERVICE_NAME: limit-service
        SERVICE_PORT: 8084
    container_name: mt-limit
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/limit_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  transaction-service:
    build:
      context: .
      args:
        SERVICE_NAME: transaction-service
        SERVICE_PORT: 8085
    container_name: mt-transaction
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  # ===================== TRANSFER SERVICES =====================

  internal-transfer-service:
    build:
      context: .
      args:
        SERVICE_NAME: internal-transfer-service
        SERVICE_PORT: 8086
    container_name: mt-internal-transfer
    ports:
      - "8086:8086"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  external-transfer-service:
    build:
      context: .
      args:
        SERVICE_NAME: external-transfer-service
        SERVICE_PORT: 8087
    container_name: mt-external-transfer
    ports:
      - "8087:8087"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  napas-simulator:
    build:
      context: .
      args:
        SERVICE_NAME: napas-simulator
        SERVICE_PORT: 8088
    container_name: mt-napas
    ports:
      - "8088:8088"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

  # ===================== GATEWAY =====================

  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 8080
    container_name: mt-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - money-transfer-net

volumes:
  postgres-data:

networks:
  money-transfer-net:
    name: money-transfer-net
