server:
  port: 8090

spring:
  application:
    name: onboarding-service
  datasource:
    url: jdbc:postgresql://localhost:5432/onboarding_db
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

camunda.bpm:
  auto-deployment-enabled: true
  database:
    schema-update: true
  job-execution:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
